{% extends "base.html" %}

{% block title %}Register — AI Student Hub{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Create Student Account</h2>
            <p>Join AI Student Hub to assess your skills and track learning analytics.</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="auth-form" autocomplete="off">
            <div class="form-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Rahul Sharma" autocomplete="off" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">College Email Address <span class="required">*</span></label>
                <input type="email" id="email" name="email" class="form-control" placeholder="e.g. rahul@studenthub.com" autocomplete="off" required>
            </div>

            <div class="form-row">
                <div class="form-group col">
                    <label for="course">Course / Degree</label>
                    <input type="text" id="course" name="course" class="form-control" value="BCA" placeholder="BCA">
                </div>
                <div class="form-group col">
                    <label for="semester">Semester</label>
                    <select id="semester" name="semester" class="form-control">
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5" selected>Semester 5</option>
                        <option value="6">Semester 6</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password <span class="required">*</span></label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password <span class="required">*</span></label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat your password" minlength="6" autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Register Account &rarr;</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}">Log in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
